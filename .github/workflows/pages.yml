name: Publish Simple index
run-name: Simple index · ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - "src/rimera_forge/index.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Merge live PyPI files with Rimera-built wheels
        run: python -m rimera_forge index --registry registry --out site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_3.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_1.outputs.page_url }}
    steps:
      - name: Deploy · attempt 1
        id: deploy_1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry 2
        if: ${{ steps.deploy_1.outcome == 'failure' }}
        run: sleep 15

      - name: Deploy · attempt 2
        id: deploy_2
        if: ${{ steps.deploy_1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry 3
        if: ${{ steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' }}
        run: sleep 30

      - name: Deploy · attempt 3
        id: deploy_3
        if: ${{ steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Defer refresh when GitHub Pages is unavailable
        if: ${{ steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' && steps.deploy_3.outcome == 'failure' }}
        run: |
          echo "::warning::GitHub Pages rejected all three deploy attempts. The generated Simple index is valid; the hourly schedule will retry automatically."
          echo "### Pages refresh deferred" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Pages returned a server-side failure after three attempts. Forge artifacts and registry metadata remain published; the hourly Pages schedule will retry." >> "$GITHUB_STEP_SUMMARY"
